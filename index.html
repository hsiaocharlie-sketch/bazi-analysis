<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
子平八字研究系统
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
子平八字研究系统
</h1>


<section class="input-card">


<h2>
出生资料
</h2>


<label>
出生日期
</label>

<input 
id="birthDate"
type="date"
value="1984-01-10">


<label>
出生时间
</label>

<input
id="birthTime"
type="time"
value="03:30">


<label>
出生地点
</label>

<input
id="location"
type="text"
value="上海">


<label>
性别
</label>

<select id="gender">

<option value="female">
女性
</option>

<option value="male">
男性
</option>

</select>



<button onclick="analyze()">

开始分析

</button>


</section>



<div id="report">

</div>



</div>



<!-- 基础数据 -->

<script src="js/hiddenStems.js"></script>

<script src="js/wuxing.js"></script>



<!-- 四柱计算 -->

<script src="js/yearPillar.js"></script>

<script src="js/monthPillar.js"></script>

<script src="js/dayPillar.js"></script>

<script src="js/hourPillar.js"></script>



<!-- 八字核心 -->

<script src="js/bazi.js"></script>



<!-- 分析 -->

<script src="js/shishen.js"></script>

<script src="js/wuxingAnalysis.js"></script>

<script src="js/strength.js"></script>

<script src="js/analysis.js"></script>



<!-- 显示 -->

<script src="js/report.js"></script>


<script src="js/app.js"></script>



</body>

</html>
