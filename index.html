<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>子平八字研究系统</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<header>

<h1>子平八字研究系统</h1>

<p>Bazi Engine</p>

</header>



<section class="input-card">


<h2>出生资料</h2>


<label>出生日期</label>

<input id="birthDate" type="date">



<label>出生时间</label>

<input id="birthTime" type="time">



<label>出生地点</label>

<input id="location" 
placeholder="例如：大理">


<label>性别</label>

<select id="gender">

<option value="male">
男
</option>

<option value="female">
女
</option>

</select>


<button onclick="analyze()">
开始分析
</button>


</section>



<div id="report"></div>


</div>



<script src="js/bazi.js"></script>

<script src="js/analysis.js"></script>

<script src="js/report.js"></script>

<script src="js/app.js"></script>


</body>

</html>
