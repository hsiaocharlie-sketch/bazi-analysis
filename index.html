<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
子平八字研究系统
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<header>

<h1>
子平八字研究系统
</h1>

<p>
Bazi Engine Research Version
</p>

</header>



<section class="input-card">


<h2>
出生资料
</h2>


<label>
出生日期
</label>

<input 
id="birthDate"
type="date"
value="1984-01-10">


<label>
出生时间
</label>

<input
id="birthTime"
type="time"
value="03:30">


<label>
出生地点
</label>

<input
id="location"
type="text"
value="上海"
placeholder="请输入城市">


<label>
性别
</label>

<select id="gender">

<option value="female" selected>
女
</option>

<option value="male">
男
</option>

</select>


<label>
时间计算方式
</label>

<select id="timeMode">

<option value="standard">
北京时间
</option>

<option value="solar">
真太阳时
</option>

</select>


<button onclick="analyze()">
开始分析
</button>


</section>



<section id="report">

</section>



</div>



<script src="js/solarTerm.js"></script>

<script src="js/monthPillar.js"></script>

<script src="js/dayPillar.js"></script>

<script src="js/bazi.js"></script>

<script src="js/analysis.js"></script>

<script src="js/report.js"></script>

<script src="js/app.js"></script>


</body>

</html>
